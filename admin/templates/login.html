<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Admin Cabinets Comptables</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      background: #0c1628;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      position: relative; overflow: hidden;
    }
    /* Ambient glow */
    body::before {
      content: '';
      position: absolute; top: -20%; left: 50%; transform: translateX(-50%);
      width: 800px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(37,99,235,.12) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute; bottom: -10%; right: 10%;
      width: 500px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(10,124,92,.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-wrapper { width: 100%; max-width: 400px; position: relative; z-index: 1; }

    /* Logo block */
    .login-logo {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 32px;
    }
    .login-logo-icon {
      width: 60px; height: 60px; border-radius: 18px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(37,99,235,.35);
      margin-bottom: 16px;
    }
    .login-logo-icon svg { width: 28px; height: 28px; color: white; }
    .login-title {
      font-family: 'Syne', sans-serif;
      font-size: 22px; font-weight: 800; color: white;
      letter-spacing: -.02em; margin-bottom: 4px;
    }
    .login-subtitle { font-size: 13px; color: rgba(255,255,255,.4); }

    /* Card */
    .login-card {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(20px);
    }

    /* Error */
    .error-box {
      display: flex; align-items: center; gap: 10px;
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25);
      color: #fca5a5; border-radius: 10px;
      padding: 12px 14px; font-size: 13px; margin-bottom: 20px;
    }

    /* Form */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: rgba(255,255,255,.5); text-transform: uppercase;
      letter-spacing: .07em; margin-bottom: 8px;
    }
    .form-input {
      width: 100%; padding: 12px 14px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      color: white; font-family: 'DM Sans', sans-serif;
      font-size: 14px; outline: none;
      transition: border-color .2s, background .2s;
    }
    .form-input::placeholder { color: rgba(255,255,255,.25); }
    .form-input:focus {
      border-color: rgba(59,130,246,.6);
      background: rgba(59,130,246,.08);
      box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }

    .btn-submit {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white; font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 600;
      border: none; border-radius: 10px;
      cursor: pointer; margin-top: 8px;
      box-shadow: 0 4px 16px rgba(37,99,235,.35);
      transition: all .2s;
    }
    .btn-submit:hover { background: linear-gradient(135deg, #3b82f6, #2563eb); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(37,99,235,.45); }
    .btn-submit:active { transform: translateY(0); }

    .login-footer {
      text-align: center; font-size: 12px;
      color: rgba(255,255,255,.2); margin-top: 20px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .login-footer::before, .login-footer::after {
      content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.06);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">

    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color:white;">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
      </div>
      <div class="login-title">Espace Admin</div>
      <div class="login-subtitle">cabinets-comptables.name</div>
    </div>

    <!-- Card -->
    <div class="login-card">

      {% if error %}
      <div class="error-box">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20" style="flex-shrink:0;">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/admin/login">
        <div class="form-group">
          <label class="form-label" for="username">Identifiant</label>
          <input class="form-input" type="text" id="username" name="username"
                 required autocomplete="username" placeholder="admin">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Mot de passe</label>
          <input class="form-input" type="password" id="password" name="password"
                 required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit">Se connecter</button>
      </form>
    </div>

    <div class="login-footer">Connexion sécurisée — session 8h</div>
  </div>

</body>
</html>
