[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt -r admin/requirements.txt"

[deploy]
startCommand = "python admin/server.py"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production.variables]
PORT = "8080"
# Variables à définir dans Railway Dashboard → Variables :
# ADMIN_USERNAME        = "admin"      (ou votre login)
# ADMIN_PASSWORD_HASH   = "..."        (généré via /admin/password)
# ANTHROPIC_API_KEY     = "sk-ant-..." (pour le générateur blog IA)
